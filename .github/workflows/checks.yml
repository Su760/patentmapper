name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  milestone1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: patentmapper_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d patentmapper_m1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MILESTONE1_TEST_DSN: postgresql://postgres:test-only-password@localhost:5432/patentmapper_m1_test
      REQUIRE_FRONTEND_TESTS: "1"
      MOCK_MODE: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-public-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL test client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Backend, real SQL/RLS/concurrency, and browser API contract
        run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit --incremental false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.config.cjs
        working-directory: frontend

  auth-postgrest:
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "true"
      MILESTONE1_DISPOSABLE_SUPABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -r backend/requirements.txt
      - name: Start disposable local Supabase and apply migrations
        run: python supabase/tests/local_http_setup.py "$RUNNER_TEMP/patentmapper-m1-http"
      - name: Real Auth and PostgREST with mocked paid providers
        working-directory: backend
        run: MILESTONE1_SUPABASE_CONFIG="$RUNNER_TEMP/patentmapper-m1-http/test-config.json" python -m unittest discover -s tests -p test_supabase_http.py -v
      - name: Stop disposable Supabase
        if: always()
        run: npx --yes supabase@2.119.0 stop --workdir "$RUNNER_TEMP/patentmapper-m1-http" --no-backup
